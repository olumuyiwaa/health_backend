    delete:
      tags: [Facilities]
      summary: Remove a workplace requirement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: reqId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Requirement removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

  /facilities/{id}/members:
    post:
      tags: [Facilities]
      summary: Invite a team member to a facility
      description: |
        Creates a new `TEAM_MEMBER` user if the email doesn't exist,
        then links them to the facility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email:           { type: string, format: email }
                firstName:       { type: string }
                lastName:        { type: string }
                jobTitle:        { type: string }
                permissionsMask: { type: object, description: 'Granular permission toggle map' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FacilityMember' }

