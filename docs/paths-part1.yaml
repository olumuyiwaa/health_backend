      summary: Update a team member's details or permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jobTitle:        { type: string }
                isActive:        { type: boolean }
                permissionsMask: { type: object }
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
