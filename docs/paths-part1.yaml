      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }

