  /facilities/{id}/requirements:
    get:
      tags: [Facilities]
      summary: List workplace requirements for a facility
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Requirements list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkplaceRequirement' }
    post:
      tags: [Facilities]
      summary: Add or update a workplace requirement
      description: Upserts by `credentialType` — one requirement per type per facility.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialType]
              properties:
                credentialType:  { $ref: '#/components/schemas/CredentialType' }
                customLabel:     { type: string }
                isMandatory:     { type: boolean, default: true }
                appliesToRoles:
                  type: array
                  items: { $ref: '#/components/schemas/NurseDesignation' }
                notes: { type: string }
      responses:
        '201':
          description: Requirement saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkplaceRequirement' }

