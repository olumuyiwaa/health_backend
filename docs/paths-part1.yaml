      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressLine1, city, state, zipCode]
              properties:
                label:        { type: string, default: Primary }
                addressLine1: { type: string }
                addressLine2: { type: string }
                city:         { type: string }
                state:        { type: string }
                zipCode:      { type: string }
                isPrimary:    { type: boolean }
      responses:
        '201':
          description: Address added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FacilityAddress' }

