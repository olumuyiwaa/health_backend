      description: '**Roles:** SUPER_ADMIN, RECRUITER, FACILITY_ADMIN'
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: facilityId
          in: query
          schema: { type: string, format: uuid }
        - name: designation
          in: query
          schema: { $ref: '#/components/schemas/NurseDesignation' }
      responses:
        '200':
          description: Worker activity data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
