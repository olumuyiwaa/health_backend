                          visits:
                            type: object
                            properties:
                              flaggedOverrides: { type: integer }
                          payouts:
                            type: object
                            properties:
                              pendingCount:  { type: integer }
                              pendingAmount: { type: number }

  /reports/shifts:
    get:
      tags: [Reports]
      summary: Shift analytics — fill rate, completion rate, breakdowns
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
