  /reports/billing:
    get:
      tags: [Reports]
      summary: Billing report — invoice totals, by status, recent invoices
      description: '**Roles:** SUPER_ADMIN, FACILITY_ADMIN'
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: facilityId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Billing report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totals:         { type: object }
                          byStatus:       { type: array, items: { type: object } }
                          recentInvoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }

  /reports/audit-trail:
    get:
      tags: [Reports]
      summary: Full audit trail with filters
      description: '**Roles:** SUPER_ADMIN'
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: resource
          in: query
          schema: { type: string, example: Shift }
        - name: action
          in: query
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, LOGIN, LOGOUT, APPROVE, REJECT,
                   SUSPEND, RESTORE, UPLOAD, DOWNLOAD]
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:    { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:           { type: string, format: uuid }
                        action:       { type: string }
                        resource:     { type: string }
                        resourceId:   { type: string }
                        previousData: { type: object }
                        newData:      { type: object }
                        ipAddress:    { type: string }
                        createdAt:    { type: string, format: date-time }
                        user:
                          type: object
                          properties:
                            email: { type: string }
                            role:  { $ref: '#/components/schemas/UserRole' }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }

  # ═══════════════════════════════════════════
  # STORAGE
  # ═══════════════════════════════════════════

  /storage/folders:
    get:
      tags: [Storage]
      summary: List upload folders accessible to the current user
      description: Returns allowed extensions and max size for each folder the user can write to.
      responses:
        '200':
          description: Accessible folders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            folder:
                              { $ref: '#/components/schemas/StorageFolder' }
                            allowedExtensions:
                              type: array
                              items: { type: string }
                            maxSizeMB: { type: integer }

  /storage/signed-upload-url:
    post:
      tags: [Storage]
      summary: Request a pre-signed PUT URL for direct-to-Spaces upload
      description: |
        Preferred for large files. The client PUTs the file directly to DigitalOcean Spaces
        using the returned URL (valid for **5 minutes**).  
        After a successful upload, call `POST /storage/confirm` to validate and get a download URL.

        **Folder access is role-gated:**

        | Folder | Allowed Roles |
        |--------|---------------|
        | `credentials` | NURSE |
        | `facility-logos` | SUPER_ADMIN, FACILITY_ADMIN |
        | `facility-documents` | SUPER_ADMIN, FACILITY_ADMIN, TEAM_MEMBER |
        | `avatars` | All roles |
        | `chat-attachments` | All roles |
        | `visit-signatures` | NURSE |
        | `admin-documents` | SUPER_ADMIN |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, filename, contentType]
              properties:
                folder:      { $ref: '#/components/schemas/StorageFolder' }
                filename:    { type: string, example: 'nursing-license.pdf' }
                contentType: { type: string, example: 'application/pdf' }
      responses:
        '201':
          description: Signed URL generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          uploadUrl:   { type: string, description: 'Pre-signed PUT URL (5 min)' }
                          objectKey:   { type: string, example: 'credentials/abc-uuid.pdf' }
                          expiresIn:   { type: integer, example: 300 }
                          maxBytes:    { type: integer }
                          confirmUrl:  { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415':
          description: File type not allowed for this folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /storage/confirm:
    post:
      tags: [Storage]
      summary: Confirm a completed direct upload and receive a download URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectKey]
              properties:
                objectKey: { type: string, example: 'credentials/abc-uuid.pdf' }
      responses:
        '200':
          description: Upload confirmed, download URL returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          objectKey:   { type: string }
                          downloadUrl: { type: string, description: 'Signed URL valid for 1 hour' }
                          expiresIn:   { type: integer, example: 3600 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /storage/upload/{folder}:
    post:
      tags: [Storage]
      summary: Proxied multipart upload through the API server
      description: |
        Suitable for smaller files. The file is streamed through the API to Spaces.  
        For large files use `POST /storage/signed-upload-url` instead.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StorageFolder' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UploadResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: File exceeds folder size limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: File type not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /storage/download:
    get:
      tags: [Storage]
      summary: Generate a fresh signed download URL for a private object
      parameters:
        - name: key
          in: query
          required: true
          description: Spaces object key (e.g. `credentials/abc.pdf`)
          schema: { type: string }
        - name: expiresIn
          in: query
          description: URL validity in seconds (max 86400 / 24 h)
          schema: { type: integer, default: 3600 }
      responses:
        '200':
          description: Signed download URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          objectKey:   { type: string }
                          downloadUrl: { type: string }
                          expiresIn:   { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /storage:
    delete:
      tags: [Storage]
      summary: Hard-delete an object from Spaces
      description: '**Roles:** SUPER_ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: 'credentials/abc.pdf' }
