                            completedShifts:  { type: integer }
                            cancelledShifts:  { type: integer }
                            upcomingShifts:   { type: integer }
                            avgVisitMinutes:  { type: integer }
                            totalEarnings:    { type: number }

  /reports/credentials/expiry:
